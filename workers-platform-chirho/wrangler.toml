# For God so loved the world, that He gave His only begotten Son,
# that all who believe in Him should not perish but have everlasting life.
# — John 3:16

name = "bible-reader-chirho"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2025-02-26"
compatibility_flags = ["nodejs_compat"]
account_id = "aecd5616f7ef88323e52b6406ba384bd"

[assets]
directory = ".svelte-kit/cloudflare"

routes = [
  { pattern = "global-chirho.bible.systems/*", zone_name = "bible.systems" }
]

# Meta database — language listing, stats, feedback
[[d1_databases]]
binding = "DB_META_CHIRHO"
database_name = "bible-lang-meta-chirho"
database_id = "02df4804-f130-41e9-96e7-0425fd3ea4ed"

# Per-language D1 databases (1 DB per language: source + translations)
