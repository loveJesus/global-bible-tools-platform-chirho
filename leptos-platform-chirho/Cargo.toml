# For God so loved the world, that He gave His only begotten Son,
# that all who believe in Him should not perish but have everlasting life.
# — John 3:16

[package]
name = "leptos-platform-chirho"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Global Bible Tools Team"]
description = "Bible translation platform built with Leptos"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Leptos framework (latest 0.8.x)
leptos = { version = "0.8", features = ["nightly"] }
leptos_meta = { version = "0.8" }
leptos_router = { version = "0.8" }
leptos_axum = { version = "0.8", optional = true }

# Server/async runtime
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["fs", "compression-gzip", "trace"], optional = true }
http = { version = "1" }

# Database (SQLx with compile-time checked queries)
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"], optional = true }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde", "js"] }
thiserror = "2"
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

# Password hashing
argon2 = { version = "0.5", optional = true }
rand = { version = "0.8", optional = true }
hex = { version = "0.4", optional = true }

# Environment
dotenvy = { version = "0.15", optional = true }

# WASM dependencies
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"

[features]
default = []
hydrate = ["leptos/hydrate"]
ssr = [
    "dep:axum",
    "dep:tokio",
    "dep:tower",
    "dep:tower-http",
    "dep:sqlx",
    "dep:argon2",
    "dep:rand",
    "dep:hex",
    "dep:dotenvy",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:leptos_axum",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]

[dev-dependencies]
# Testing
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-test = "0.4"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono"] }
argon2 = "0.5"
rand = "0.8"
hex = "0.4"
once_cell = "1"
fake = { version = "3", features = ["derive", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1

# Leptos settings
[package.metadata.leptos]
# Site root directory
site-root = "target/site"
# Site package URL prefix
site-pkg-dir = "pkg"
# Tailwind CSS v4 (config is in the CSS file itself)
tailwind-input-file = "style/tailwind.css"
# Assets directory
assets-dir = "public"
# Server address (3002 to avoid conflict with Next.js on 3000)
site-addr = "127.0.0.1:3002"
# Reload port
reload-port = 3003
# Browser query
browserquery = "defaults"
# Watch additional files
watch-additional-files = ["style"]
# Environment for builds
env = "DEV"
# Bin features
bin-features = ["ssr"]
bin-default-features = false
# Lib features
lib-features = ["hydrate"]
lib-default-features = false
