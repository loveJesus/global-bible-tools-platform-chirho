# For God so loved the world, that He gave His only begotten Son,
# that all who believe in Him should not perish but have everlasting life.
# — John 3:16

services:
  # Caddy reverse proxy with self-signed SSL
  caddy-chirho:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy-data-chirho:/data
      - caddy-config-chirho:/config
    depends_on:
      - server-chirho

  server-chirho:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    restart: always
    environment:
      DATABASE_URL_CHIRHO: postgresql://postgres:asdfasdf@db-chirho:5432/postgres
      TEST_DATABASE_URL_CHIRHO: postgresql://postgres:asdfasdf@test-db-chirho:5432/postgres
      # R2-compatible storage (Cloudflare R2 or MinIO for local dev)
      R2_ENDPOINT_CHIRHO: http://minio-chirho:9000
      R2_ACCESS_KEY_CHIRHO: minioadmin
      R2_SECRET_KEY_CHIRHO: minioadmin
      R2_BUCKET_CHIRHO: bible-tools-chirho
      # Email configuration
      MAILU_API_URL_CHIRHO: ${MAILU_API_URL_CHIRHO:-https://mailer-aleluya.xjes.us}
      MAILU_API_TOKEN_CHIRHO: ${MAILU_API_TOKEN_CHIRHO}
      TWOSMTP_API_KEY_CHIRHO: ${TWOSMTP_API_KEY_CHIRHO}
      TWOSMTP_FROM_EMAIL_CHIRHO: noreply@global.noreply.fe
      # Session
      SESSION_SECRET_CHIRHO: ${SESSION_SECRET_CHIRHO:-change-this-in-production-chirho}
      NODE_ENV: development
    volumes:
      - ./:/app
      - sveltekit-node-modules-chirho:/app/node_modules
    expose:
      - 5173
    depends_on:
      db-chirho:
        condition: service_healthy
      minio-chirho:
        condition: service_healthy
    command: bun run dev-chirho --host

  db-chirho:
    image: postgres:16
    restart: always
    shm_size: 256mb
    user: postgres
    volumes:
      - db-data-chirho:/var/lib/postgresql/data
      - ./migrations-chirho:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: asdfasdf
    expose:
      - 5432
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5

  test-db-chirho:
    image: postgres:16
    restart: always
    shm_size: 128mb
    user: postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: asdfasdf
    expose:
      - 5432
    ports:
      - 5433:5432
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO for S3-compatible storage (replaces AWS LocalStack)
  minio-chirho:
    image: minio/minio:latest
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data-chirho:/data
    ports:
      - 9000:9000
      - 9001:9001
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO setup - creates bucket on startup
  minio-setup-chirho:
    image: minio/mc:latest
    depends_on:
      minio-chirho:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio-chirho:9000 minioadmin minioadmin;
      mc mb --ignore-existing myminio/bible-tools-chirho;
      mc anonymous set public myminio/bible-tools-chirho;
      exit 0;
      "

volumes:
  db-data-chirho:
  minio-data-chirho:
  sveltekit-node-modules-chirho:
  caddy-data-chirho:
  caddy-config-chirho:
